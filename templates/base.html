<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    {% block styles %}
    <!-- Load Bootstrap-Flask CSS here -->
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet">
    <!-- Link to the styles.css here to apply styling to all the child templates.-->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Nunito+Sans:300,400,700"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Poppins:300,400,700"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
      integrity="sha512-1PKOgIY59xJ8Co8+NE6FZ+LOAZKjy+KY8iq0G4B3CyeY6wYHN3yt9PW0XpSriVlkMXe40PTKnXrLnZ9+fkDaog=="
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
    {% endblock %}

    <title>{% block title %}{% endblock %}</title>
  </head>

    <body>
        <!-- navbar fixed-top  -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary nav fixed-top" style="border-color: black">
          <div class="container-fluid" style="background-color: black">
            <a class="navbar-brand navbar-text" href="#" style="font-size: 30px"><img src="{{ url_for('static', filename='images/Macro Perspective logo.jpg') }}" alt="Logo" width="75" height="75"/>Macro Perspective</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon" style="border-color: white;"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav ms-auto me-3 mb-2 mb-lg-0">
                <li class="nav-item me-3">
                  <a class="nav-link navbar-text" href="{{ url_for('home') }}">Home</a>
                </li>
                <li class="nav-item me-3">
                  <a class="nav-link navbar-text" href="{{ url_for('contact') }}">Contact</a>
                {% if not logged_in: %}
                <li class="nav-item me-3">
                  <a class="nav-link navbar-text" href="{{ url_for('login') }}">Login</a>
                </li>
                <li class="nav-item me-3">
                  <a class="nav-link navbar-text" href="{{ url_for('register') }}">Sign Up</a>
                </li>
                {% else: %}
                <li class="nav-item me-3">
                  <a class="nav-link navbar-text" href="{{ url_for('account') }}">Account</a>
                </li>
                <li class="nav-item me-3">
                  <a class="nav-link navbar-text" href="{{ url_for('logout') }}">Log Out</a>
                </li>
                {% endif %}

              </ul>
            </div>
          </div>
        </nav>
        <div style="height:110px"></div>
         <div id="page-container">
           <div id="content-wrap" style="padding-bottom: 0px">
            {% block content %}{% endblock %}
           </div>
           <footer id="footer" class="footer pb-5">
            <img src="{{ url_for('static', filename='images/Macro Perspective logo.jpg') }}" width="100px" height="100px">

           </footer>
         </div>

        <script crossorigin="anonymous"
              integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
              src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
        </script>
        <!-- footer -->

    </body>
</html>
